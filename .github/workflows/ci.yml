name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          flakehub: false
      - name: Check flake shape
        run: nix flake check --no-build --print-build-logs
      - name: Check module evaluation markers
        run: |
          nix build \
            .#checks.x86_64-linux.eval-images \
            .#checks.x86_64-linux.eval-mpp \
            .#checks.x86_64-linux.eval-aic8800-stable-mac \
            .#checks.x86_64-linux.eval-cpu-stalls \
            --no-link \
            --print-build-logs
